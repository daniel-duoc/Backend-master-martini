# Nombre del microservicio
spring.application.name=usuarios-service

# Puerto del microservicio
server.port=9102

# Base de datos local temporal
spring.datasource.url=jdbc:h2:mem:martini_usuarios
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configuracion JWT RSA
jwt.public-key.path=${JWT_PUBLIC_KEY_PATH}
jwt.issuer=master-martini

# Autenticacion interna entre microservicios
internal.service.key=${INTERNAL_SERVICE_KEY}